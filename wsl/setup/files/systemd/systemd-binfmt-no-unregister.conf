# Deploy to /etc/systemd/system/systemd-binfmt.service.d/no-unregister.conf
#
# The stock unit ships ExecStop=/usr/lib/systemd/systemd-binfmt --unregister.
# Because binfmt_misc is GLOBAL to the WSL VM kernel, that stop action flushes
# the table shared by every distro, silently killing WSL interop in any OTHER
# distro still running. Clearing ExecStop makes stopping this unit a no-op.
#
# Scope: this covers a GRACEFUL shutdown of a distro (e.g. `systemctl poweroff`
# inside it). It does NOT cover `wsl --terminate`, which is a hard kill that
# never runs ExecStop -- only wsl-binfmt-guard.timer covers that case.
[Service]
ExecStop=
