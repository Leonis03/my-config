[boot]
systemd=true

[user]
default=<your-linux-user>

[interop]
enabled=true
appendWindowsPath=false

[automount]
# Do NOT auto-mount every drive letter. WSL holds removable media (USB sticks,
# card readers) open, so an auto-mounted stick cannot be ejected from Windows
# without a full `wsl --shutdown`. Fixed drives are mounted explicitly in
# /etc/fstab instead -- see files/fstab.
#
# Note: with enabled=false the `options =` key no longer applies; mount options
# move into the fstab entries.
enabled = false
mountFsTab = true
